<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Athena Trading{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <div class="brand">
            <h1>Athena Trading ✦</h1>
        </div>

        <nav>
            <a href="{{ url_for('customer_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('stocks') }}">Stocks</a>
            <a href="{{ url_for('portfolio') }}">Portfolio</a>
			<a href="{{ url_for('current_orders') }}">Current Orders</a>
            <a href="{{ url_for('transactions') }}">Transaction History</a>
			<a href="{{ url_for('login') }}" class="login-nav-button">Log In</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
